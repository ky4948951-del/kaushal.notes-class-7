<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Radha Musical Store</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#100e17;
  color:#fff;
}
header{
  text-align:center;
  padding:25px 12px;
  background:linear-gradient(135deg,#35105e,#a12c68);
  border-bottom:3px solid #ffc857;
}
header h1{margin:0;font-size:27px}
header p{color:#ffe4a5}
nav{
  background:#211c2b;
  padding:12px;
  text-align:center;
}
nav a{
  color:white;
  text-decoration:none;
  margin:8px;
  display:inline-block;
}
.hero{
  padding:35px 15px;
  text-align:center;
  background:linear-gradient(135deg,#241039,#642044);
}
.hero h2{color:#ffc857}
.container{max-width:1100px;margin:auto;padding:15px}
.section-title{text-align:center;color:#ffc857;margin:30px 0 20px}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:7px;
  border:1px solid #aaa;
  font-size:15px;
}
button{
  padding:10px 13px;
  margin:4px;
  border:0;
  border-radius:7px;
  background:#ffc857;
  color:#24142e;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#ffe4a5}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:13px;
}
.card{
  background:#211c2b;
  border:1px solid #494052;
  border-radius:12px;
  padding:12px;
  text-align:center;
}
.product-image{
  height:110px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#34283e;
  border-radius:8px;
  font-size:52px;
  overflow:hidden;
}
.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.card h3{font-size:16px;min-height:35px}
.price{color:#ffc857;font-size:19px;font-weight:bold}
.panel{
  background:#211c2b;
  border-radius:12px;
  padding:17px;
  margin:22px 0;
}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{
  border-bottom:1px solid #51475b;
  padding:10px 6px;
  text-align:left;
}
.table-wrap{overflow-x:auto}
.notice{
